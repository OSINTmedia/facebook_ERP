<div id="product-workspace-results" class="product-workspace-results">
  {% if products %}
    <ul class="product-list" aria-label="Products">
      {% for product in products %}
        <li class="product-list__item">
          <article class="product-summary">
            <div>
              <h2>{{ product.name }}</h2>
              <p>{{ product.description }}</p>
            </div>
            <div class="product-summary__actions">
              <span class="status-pill">{{ product.get_lifecycle_display }}</span>
              <a class="button button--secondary button--compact" href="{% url 'catalog:product_edit' product.pk %}?next={{ workspace_return_url|urlencode }}">Edit</a>
            </div>
          </article>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <div class="empty-state" role="status">
      <p>No products yet.</p>
    </div>
    <div class="page-actions">
      <a class="button button--primary" href="{% url 'catalog:product_create' %}?next={{ workspace_return_url|urlencode }}">Add product</a>
    </div>
  {% endif %}
</div>
