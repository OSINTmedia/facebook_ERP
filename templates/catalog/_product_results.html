<div id="product-workspace-results" class="product-workspace-results">
  {% if product_cards %}
    <ul class="product-list" aria-label="Products">
      {% for card in product_cards %}
        <li class="product-list__item">
          {% include "catalog/_product_card.html" with card=card workspace_return_url=workspace_return_url only %}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <div class="empty-state" role="status">
      <p>No products yet.</p>
    </div>
    <div class="page-actions">
      <a class="button button--primary" href="{% url 'catalog:product_create' %}?next={{ workspace_return_url|urlencode }}">Add product</a>
    </div>
  {% endif %}
</div>
