name: Django CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: facebook_erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d facebook_erp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/facebook_erp_ci
      TEST_DATABASE_NAME: test_facebook_erp_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify installed packages
        run: python -m pip check

      - name: Run Django system check
        run: python manage.py check --settings=config.settings.test

      - name: Check migration files are current
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Apply migrations
        run: python manage.py migrate --settings=config.settings.test --noinput

      - name: Check unapplied migrations
        run: python manage.py migrate --check --settings=config.settings.test

      - name: Run Django tests
        run: python manage.py test --settings=config.settings.test -v 2
